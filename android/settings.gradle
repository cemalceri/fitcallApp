pluginManagement {
    def flutterSdkPath = {
        def properties = new Properties()
        file("local.properties").withInputStream { properties.load(it) }
        def flutterSdkPath = properties.getProperty("flutter.sdk")
        assert flutterSdkPath != null, "flutter.sdk not set in local.properties"
        return flutterSdkPath
    }
    settings.ext.flutterSdkPath = flutterSdkPath()

    includeBuild("${settings.ext.flutterSdkPath}/packages/flutter_tools/gradle")

    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

plugins {
    id "dev.flutter.flutter-plugin-loader" version "1.0.0"
    // AGP/Gradle/Kotlin sürümleri stable Flutter 3.47 şablonuyla aynı (AGP 9.1.0,
    // Gradle 9.3.1, KGP 2.4.0). AGP 9 en az Flutter 3.44 ister; yeni DSL
    // gradle.properties'te kapalı, Flutter eklentisi henüz desteklemiyor.
    // Play "R8 optimizasyonu" önerisi AGP 9 istiyor (2026-10-30).
    // Kotlin gömülü (Flutter 3.47+); KGP burada yalnız Kotlin derleyici sürümünü
    // belirliyor, hiçbir modüle uygulanmıyor.
    id "com.android.application" version "9.1.0" apply false
    id "com.google.gms.google-services" version "4.3.15" apply false
    id "org.jetbrains.kotlin.android" version "2.4.0" apply false
}

include ":app"
